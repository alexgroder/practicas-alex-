
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestión de Equipos</title>
    <link rel="stylesheet" href="styles5.css">
</head>
<body>

    <div class="dashboard">

        <div class="card equipos">
            <div class="icono">💻</div>
            <h3>Total de equipos</h3>
            <h1>120</h1>
            <p>Equipos registrados</p>
        </div>

        <div class="card operativos">
            <div class="icono">✔️</div>
            <h3>Equipos operativos</h3>
            <h1>95</h1>
            <p>En funcionamiento</p>
        </div>

        <div class="card mantenimiento">
            <div class="icono">🔧</div>
            <h3>En mantenimiento</h3>
            <h1>15</h1>
            <p>Equipos en revisión</p>
        </div>

        <div class="card incidencias">
            <div class="icono">📋</div>
            <h3>Incidencias pendientes</h3>
            <h1>10</h1>
            <p>Por resolver</p>
        </div>

    </div>

</body>
</html>
