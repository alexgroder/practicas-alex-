<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos</title>
    <link rel="stylesheet" href="styles6.css">
</head>
<body>

                    <th>Código</th>

                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>EQ-001</td>
                    <td>Computadora Dell</td>

                <tr>
                    <td>EQ-002</td>
                    <td>Laptop HP</td>
                    <td>Contabilidad</td>
                    <td><span class="estado mantenimiento">Mantenimiento</span></td>
                </tr>

                <tr>
                    <td>EQ-003</td>
                    <td>Computadora Lenovo</td>
                    <td>Informática</td>
                    <td><span class="estado operativo">Operativo</span></td>
                </tr>

                <tr>
                    <td>EQ-004</td>
                    <td>Impresora Epson</td>
                    <td>Secretaría</td>
                    <td><span class="estado pendiente">Pendiente</span></td>
                </tr>
            </tbody>

        </table>

    </div>

</body>
</html>
